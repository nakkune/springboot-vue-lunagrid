<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LunaGrid v3.0.0 - 기능별 인터랙티브 예제 포털 (Step-by-Step Feature Showcase)</title>

  <!-- Google Fonts: Inter & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- LunaGrid Core CSS -->
  <link rel="stylesheet" href="/css/luna-lib-grid.css">

  <style>
    :root {
      --bg-canvas: #090d16;
      --bg-sidebar: #0f172a;
      --bg-panel: #131d33;
      --bg-card: #18233c;
      --bg-code: #0b1120;
      --border-color: #1e293b;
      --border-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #60a5fa;
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --sidebar-width: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================================
       1. 사이드바 (Sidebar Navigation: 17 Steps)
       ========================================================================= */
    .app-sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }

    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
    }

    .app-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .logo-text h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text span {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .sidebar-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper svg {
      position: absolute;
      left: 10px;
      color: var(--text-sub);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      background-color: var(--bg-canvas);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 12.5px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .step-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .step-list::-webkit-scrollbar {
      width: 5px;
    }

    .step-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .step-group-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      padding: 10px 10px 4px;
      margin-top: 6px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      user-select: none;
    }

    .step-item:hover {
      background-color: rgba(30, 41, 59, 0.7);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .step-item.active {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.18) 0%, rgba(139, 92, 246, 0.1) 100%);
      color: #ffffff;
      border-color: rgba(59, 130, 246, 0.4);
      font-weight: 600;
    }

    .step-num {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .step-item.active .step-num {
      background: var(--primary);
      color: #ffffff;
    }

    .step-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .step-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-desc-short {
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-item.active .step-desc-short {
      color: var(--primary-light);
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-color);
      background-color: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .doc-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--primary-light);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .doc-link-btn:hover {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* =========================================================================
       2. 메인 컨텐츠 영역 (Main Stage)
       ========================================================================= */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      background-color: var(--bg-canvas);
    }

    .stage-header {
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stage-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stage-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stage-badge {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }

    .stage-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .stage-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-item {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .stage-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* =========================================================================
       3. 인터랙티브 작업공간 (Interactive Workspace)
       ========================================================================= */
    .stage-body {
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    .action-toolbar {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-right: 4px;
    }

    .btn-ctrl {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-ctrl:hover {
      background-color: #1e293b;
      border-color: var(--primary-light);
      color: #ffffff;
    }

    .btn-ctrl.btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-ctrl.btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-ctrl.btn-success {
      background-color: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .btn-ctrl.btn-success:hover {
      background-color: var(--success);
      color: #ffffff;
    }

    .btn-ctrl.btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .btn-ctrl.btn-danger:hover {
      background-color: var(--danger);
      color: #ffffff;
    }

    .select-ctrl {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .select-ctrl:focus {
      border-color: var(--primary);
    }

    /* 그리드 렌더링 컨테이너 */
    .grid-stage-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      min-height: 560px;
      display: flex;
      flex-direction: column;
    }

    #grid-sandbox {
      width: 100%;
      height: 560px;
      min-height: 560px;
      border-radius: 6px;
    }

    /* 하단 코드 & 로그 탭 패널 */
    .code-console-panel {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-tabs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      padding: 0 12px;
    }

    .panel-tab-btns {
      display: flex;
      gap: 2px;
    }

    .tab-btn {
      padding: 10px 16px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-sub);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: var(--primary-light);
      border-bottom-color: var(--primary);
    }

    .tab-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-copy-code {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn-copy-code:hover {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .tab-content-body {
      background-color: var(--bg-code);
      padding: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 12.5px;
      line-height: 1.6;
      color: #38bdf8;
      max-height: 260px;
      overflow: auto;
      white-space: pre;
    }

    .tab-content-body::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .tab-content-body::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .log-console {
      color: #4ade80;
    }

    .log-entry {
      margin-bottom: 4px;
      padding-bottom: 2px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .log-time {
      color: var(--text-sub);
      font-size: 11px;
      margin-right: 6px;
    }

    .log-tag {
      color: #facc15;
      font-weight: 600;
      margin-right: 6px;
    }

    /* 토스트 알림 */
    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      border: 1px solid #3b82f6;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 9999;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast-popup.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- =========================================================================
       1. 좌측 17단계 기능 목록 사이드바
       ========================================================================= -->
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <a href="./luna-grid-demo.html" class="app-logo">
        <div class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </div>
        <div class="logo-text">
          <h1>LunaGrid Showcase</h1>
          <span>v3.0.0 Enterprise Architecture</span>
        </div>
      </a>
    </div>

    <div class="sidebar-search">
      <div class="search-input-wrapper">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-step-input" class="search-input" placeholder="기능 또는 키워드 검색...">
      </div>
    </div>

    <ul class="step-list" id="step-list-container">
      <!-- JavaScript로 동적 생성 및 필터링 -->
    </ul>

    <div class="sidebar-footer">
      <a href="./guide_LunaGrid.html" class="doc-link-btn" title="엔터프라이즈 개발자 가이드 문서로 이동">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        <span>📖 개발자 가이드 문서 (Docs)</span>
      </a>
    </div>
  </aside>

  <!-- =========================================================================
       2. 우측 메인 실행 샌드박스 & 코드 스테이지
       ========================================================================= -->
  <main class="app-main">
    <!-- 단계 헤더 -->
    <header class="stage-header">
      <div class="stage-topline">
        <div class="stage-title-wrap">
          <span class="stage-badge" id="view-step-num">Step 01</span>
          <h2 class="stage-title" id="view-step-title">기본 그리드 생성 & DataAdapter 바인딩</h2>
        </div>
        <div class="stage-tags" id="view-step-tags">
          <!-- 동적 태그 -->
        </div>
      </div>
      <p class="stage-desc" id="view-step-desc">
        LunaDataAdapter를 이용한 데이터 계층 분리와 GridView 렌더링 계층의 기초적인 인스턴스화 예제입니다.
      </p>
    </header>

    <!-- 인터랙티브 작업공간 -->
    <div class="stage-body">
      <!-- 기능 제어 툴바 -->
      <div class="action-toolbar">
        <div class="toolbar-left" id="action-buttons-container">
          <!-- 스텝별 인터랙티브 버튼 동적 생성 -->
        </div>
        <div class="toolbar-right">
          <span class="toolbar-title">테마 / 언어:</span>
          <select id="select-theme-ctrl" class="select-ctrl">
            <option value="classic">🏛️ Classic</option>
            <option value="dark" selected>🌙 Dark</option>
            <option value="light">☀️ Light</option>
            <option value="blue">🌊 Blue</option>
            <option value="energyblue">⚡ Energy Blue</option>
            <option value="bootstrap">🅱️ Bootstrap</option>
            <option value="material">🎨 Material</option>
          </select>
          <select id="select-locale-ctrl" class="select-ctrl">
            <option value="ko" selected>🇰🇷 한국어</option>
            <option value="en">🇺🇸 English</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="zh">🇨🇳 中文</option>
          </select>
        </div>
      </div>

      <!-- 그리드 렌더링 카드 -->
      <div class="grid-stage-card">
        <div id="grid-sandbox"></div>
      </div>

      <!-- 코드 & 실시간 로그 탭 패널 -->
      <div class="code-console-panel">
        <div class="panel-tabs-header">
          <div class="panel-tab-btns">
            <button class="tab-btn active" data-tab="js">
              <span>⚡ JavaScript 소스</span>
            </button>
            <button class="tab-btn" data-tab="data">
              <span>📦 샘플 데이터</span>
            </button>
            <button class="tab-btn" data-tab="logs">
              <span>📡 실시간 이벤트 로그</span>
            </button>
          </div>
          <div class="tab-actions">
            <button class="btn-copy-code" id="btn-copy-code" title="코드 클립보드 복사">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>코드 복사</span>
            </button>
            <button class="btn-copy-code" id="btn-clear-logs" style="display:none;" title="로그 비우기">
              <span>🗑️ 로그 삭제</span>
            </button>
          </div>
        </div>

        <pre class="tab-content-body" id="tab-content-viewer">// 소스 코드가 여기에 표시됩니다.</pre>
      </div>
    </div>
  </main>

  <!-- 복사 완료 토스트 -->
  <div class="toast-popup" id="toast-popup">메시지가 표시됩니다.</div>

  <!-- LunaGrid Engine -->
  <script src="./js/luna-lib.js?v=3.0.1"></script>

  <!-- 쇼케이스 통합 애플리케이션 스크립트 -->
  <script>
    // =========================================================================
    // 17단계 기능별 예제 메타데이터 및 실행 핸들러 정의
    // =========================================================================
    let currentGrid = null;
    let currentDataAdapter = null;
    let currentStepIndex = 0;
    let activeTab = 'js';
    const logBuffer = [];

    function showToast(msg) {
      const toast = document.getElementById('toast-popup');
      toast.textContent = msg;
      toast.classList.add('show');

    // =========================================================================
    // 헬퍼 함수 및 UI 바인딩
    // =========================================================================
    function getCurrentTheme() {
      return document.getElementById('select-theme-ctrl').value || 'dark';
    }

    function renderSidebarSteps(filterText = '') {
      const container = document.getElementById('step-list-container');
      container.innerHTML = '';

      let lastGroup = '';
      STEPS.forEach((step, idx) => {
        if (filterText) {
          const q = filterText.toLowerCase();
          const match = step.title.toLowerCase().includes(q) || 
                        step.shortDesc.toLowerCase().includes(q) || 
                        step.tags.some(t => t.toLowerCase().includes(q));
          if (!match) return;
        }

        if (step.group !== lastGroup) {
          lastGroup = step.group;
          const groupEl = document.createElement('li');
          groupEl.className = 'step-group-title';
          groupEl.textContent = step.group;
          container.appendChild(groupEl);
        }

        const li = document.createElement('li');
        li.className = `step-item ${idx === currentStepIndex ? 'active' : ''}`;
        li.innerHTML = `
          <span class="step-num">${step.num}</span>
          <div class="step-info">
            <span class="step-title">${step.title}</span>
            <span class="step-desc-short">${step.shortDesc}</span>
          </div>
        `;
        li.onclick = () => selectStep(idx);
        container.appendChild(li);
      });
    }

    function selectStep(index) {
      if (index < 0 || index >= STEPS.length) return;
      currentStepIndex = index;
      const step = STEPS[index];

      // 사이드바 활성 스타일 갱신
      renderSidebarSteps(document.getElementById('search-step-input').value);

      // 상단 헤더 갱신
      document.getElementById('view-step-num').textContent = step.num;
      document.getElementById('view-step-title').textContent = step.title;
      document.getElementById('view-step-desc').textContent = step.desc;

      // 태그 갱신
      const tagsContainer = document.getElementById('view-step-tags');
      tagsContainer.innerHTML = step.tags.map(t => `<span class="tag-item">#${t}</span>`).join('');

      // 이전 그리드 정리 및 컨테이너 비우기
      const sandbox = document.getElementById('grid-sandbox');
      const stageCard = sandbox.closest('.grid-stage-card');
      sandbox.innerHTML = '';
      if (currentGrid && currentGrid.destroy) {
        try { currentGrid.destroy(); } catch (e) {}
      }

      // 스텝별 대시보드 스케일에 맞춘 컨테이너 높이 설정
      if (step.id === 'step-17') {
        sandbox.style.height = '580px';
        if (stageCard) stageCard.style.minHeight = '580px';
      } else {
        sandbox.style.height = '560px';
        if (stageCard) stageCard.style.minHeight = '560px';
      }

      // 새 그리드 초기화 실행
      const result = step.init(sandbox);
      currentGrid = result.grid;
      currentDataAdapter = result.dp;

      // 액션 버튼들 렌더링
      const btnContainer = document.getElementById('action-buttons-container');
      btnContainer.innerHTML = '';
      if (step.actions && step.actions.length > 0) {
        step.actions.forEach(act => {
          const btn = document.createElement('button');
          btn.className = `btn-ctrl ${act.cls || ''}`;
          btn.innerHTML = `<span>${act.label}</span>`;
          btn.onclick = () => act.onClick(currentGrid, currentDataAdapter);
          btnContainer.appendChild(btn);
        });
      }

      // 코드/데이터 뷰어 갱신
      renderTabContent();
    }

    function renderTabContent() {
      const viewer = document.getElementById('tab-content-viewer');
      const step = STEPS[currentStepIndex];
      const clearBtn = document.getElementById('btn-clear-logs');

      if (activeTab === 'js') {
        clearBtn.style.display = 'none';
        viewer.textContent = step.codeJs || '// 코드가 없습니다.';
      } else if (activeTab === 'data') {
        clearBtn.style.display = 'none';
        const rows = currentDataAdapter ? (currentDataAdapter.getRows ? currentDataAdapter.getRows() : (currentDataAdapter.getTreeRows ? currentDataAdapter.getTreeRows() : [])) : [];
        viewer.textContent = JSON.stringify(rows, null, 2);
      } else if (activeTab === 'logs') {
        clearBtn.style.display = 'inline-flex';
        renderLogs();
      }
    }

    // =========================================================================
    // 이벤트 바인딩 초기화
    // =========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      // 1. 사이드바 검색 이벤트
      document.getElementById('search-step-input').addEventListener('input', (e) => {
        renderSidebarSteps(e.target.value);
      });

      // 2. 탭 전환 이벤트
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeTab = btn.getAttribute('data-tab');
          renderTabContent();
        });
      });

      // 3. 코드 복사 버튼
      document.getElementById('btn-copy-code').addEventListener('click', () => {
        const text = document.getElementById('tab-content-viewer').textContent;
        navigator.clipboard.writeText(text).then(() => {
          showToast('클립보드에 코드가 복사되었습니다!');
        });
      });

      // 4. 로그 비우기 버튼
      document.getElementById('btn-clear-logs').addEventListener('click', () => {
        logBuffer.length = 0;
        renderLogs();
        showToast('이벤트 로그가 초기화되었습니다.');
      });

      // 5. 전역 테마 컨트롤 변경
      document.getElementById('select-theme-ctrl').addEventListener('change', (e) => {
        if (currentGrid && currentGrid.setTheme) {
          currentGrid.setTheme(e.target.value);
          appendLog('THEME', `테마가 [${e.target.value}] 로 변경되었습니다.`);
        }
      });

      // 6. 전역 언어 컨트롤 변경
      document.getElementById('select-locale-ctrl').addEventListener('change', (e) => {
        const newLocale = e.target.value;
        LunaGridLocaleManager.setLocale(newLocale);
        if (currentGrid && currentGrid.setLocale) {
          currentGrid.setLocale(newLocale);
          appendLog('I18N', `로케일이 [${newLocale}] 로 변경되었습니다.`);
        }
      });

      // 7. 첫 번째 단계 초기 실행
      renderSidebarSteps();
      selectStep(0);
    });
